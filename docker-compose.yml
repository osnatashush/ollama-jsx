version: '3.8'

services:
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    # On macOS, we need to use host.docker.internal to reach the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # Full URL for Ollama server
      - OLLAMA_HOST=host.docker.internal  # For backward compatibility
      - OLLAMA_PORT=11434
    ports:
      - "8006:8006"  # Expose the backend port
    volumes:
      - ./Backend/data:/app/data
      - ./Backend/models:/app/models
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8006  # Connect to backend service by name
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    # Enable host mode for better network performance
    # This allows containers to use the host's network directly
    # which can help with localhost access
    driver_opts:
      com.docker.network.driver.mtu: "1500"
