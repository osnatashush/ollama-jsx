version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
    command:
      - serve
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 60
        curl -X POST http://localhost:11434/api/pull -d '{"name": "mistral"}'
        /bin/ollama serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 120s
    networks:
      - app-network

  backend:
    image: osnatashushdocker/ollama-jsx-backend:latest
    container_name: backend
    environment:
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    ports:
      - "8006:8006"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    command: 
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 120s
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: osnatashushdocker/ollama-jsx-frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8006
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"

volumes:
  ollama_data:
    driver: local
